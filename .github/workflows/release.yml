name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: ./gradlew :cli:distZip :app:assembleRelease --no-daemon
      - run: |
          # dist/ is also a git-tracked folder holding old release APKs used
          # by core's tests — start from a clean, release-only staging dir so
          # this job never re-uploads every previous version's files again.
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf release-out
          mkdir -p release-out
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            arch=$(echo "$base" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            if [ "$arch" = "universal" ]; then
              cp "$apk" "release-out/MrScannerOmega-${VERSION}.apk"
            fi
            cp "$apk" "release-out/MrScannerOmega-${VERSION}-${arch}.apk"
          done
          cp cli/build/distributions/*.zip release-out/ || true
          cd release-out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-out/*
