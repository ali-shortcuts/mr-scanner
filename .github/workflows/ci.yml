name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: ./gradlew :core:test :cli:installDist --no-daemon
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/app-build.log
      - name: Surface real gradle error as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED|Execution failed|e: |Manifest merger failed" /tmp/app-build.log | tail -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
